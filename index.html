    />
    <style>
      @font-face {
        font-family: 'Inter Display';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/inter-display@5.2.5/latin-600-normal.woff2)
          format('woff2');
      }
      @font-face {
        font-family: 'Inter Display';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://cdn.jsdelivr.net/fontsource/fonts/inter-display@5.2.5/latin-500-normal.woff2)
          format('woff2');
      }
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #000000;
        color: #fafafa;
      }
      .seo {
        max-width: 28rem;
        margin: 0 auto;
        padding: 4rem 1.5rem;
        text-align: center;
        line-height: 1.6;
      }
      .seo h1 {
        font-size: 2.5rem;
        letter-spacing: -0.03em;
        margin: 0 0 1rem;
      }
      .seo a {
        color: #fafafa;
      }
    </style>
    <script>
      // Preview/embed anti-flash: apply the theme synchronously from the URL so
      // a dark embed never paints light (and vice versa) before React mounts.
      (function () {
        try {
          if (window.location.pathname.indexOf('/preview') === 0) {
            var theme = new URLSearchParams(window.location.search).get('theme');
            var isLight = theme === 'light'; // preview defaults to dark
            var canvas = isLight ? '#f2f2f2' : '#151818';
            if (!isLight) document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = canvas;
          }
        } catch (e) {}
      })();
    </script>
